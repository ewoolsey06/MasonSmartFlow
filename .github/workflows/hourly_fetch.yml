# .github/workflows/hourly_fetch.yml
name: Hourly Sensor Data Refresh

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

# Add this block to allow the bot to commit changes
permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pandas requests tzdata

      - name: Run Fetch Script
        run: python fetch_data.py

 # .github/workflows/hourly_fetch.yml (Bottom Step Update)

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          
          # Only attempt to track and commit if the script successfully outputted the file
          if [ -f "latest_sensor_data.csv" ]; then
            git add latest_sensor_data.csv
            if git diff --staged --quiet; then
              echo "No data changes detected in the file. Skipping commit."
            else
              git commit -m "Automated hourly sensor data refresh"
              git push
            fi
          else
            echo "Warning: latest_sensor_data.csv was not generated. The API might be empty right now."
          fi
